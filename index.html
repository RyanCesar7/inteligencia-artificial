<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Inteligente - Gemini IA</title>
  <!-- Fontes Google Inter e FontAwesome para Ícones -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Variables & Design Tokens */
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-chat: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      
      --user-msg-bg: #2563eb;
      --user-msg-text: #ffffff;
      --bot-msg-bg: #ffffff;
      --bot-msg-text: #0f172a;
      --bot-border: #e2e8f0;
      
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --transition-speed: 0.3s;
    }

    /* Dark Mode Tokens */
    [data-theme="dark"] {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-chat: #0f172a;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border-color: #334155;
      
      --user-msg-bg: #3b82f6;
      --user-msg-text: #ffffff;
      --bot-msg-bg: #1e293b;
      --bot-msg-text: #f8fafc;
      --bot-border: #334155;
      
      --accent-color: #3b82f6;
      --accent-hover: #60a5fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* Tela de Login */
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
      background-color: var(--bg-secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .login-header {
      margin-bottom: 2rem;
    }

    .login-header i {
      font-size: 3rem;
      color: var(--accent-color);
      margin-bottom: 1rem;
    }

    .login-header h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .login-header p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: var(--radius-sm);
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-login:hover {
      background-color: var(--accent-hover);
    }

    .error-alert {
      display: none;
      align-items: center;
      gap: 0.5rem;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--danger-color);
      color: var(--danger-color);
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      animation: shake 0.3s ease-in-out;
    }

    /* Container do Chat */
    .chat-wrapper {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 90vh;
      background-color: var(--bg-secondary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    /* Cabeçalho */
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: rgba(37, 99, 235, 0.1);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .user-details h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .user-details span {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-action:hover {
      background-color: var(--bg-primary);
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--danger-color);
      border-color: var(--danger-color);
    }

    /* Área de Mensagens */
    .chat-messages {
      flex: 1;
      padding: 1.5rem;
      background-color: var(--bg-chat);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scroll-behavior: smooth;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: messageSlide 0.3s ease-out;
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    .message-sender {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .message-bubble {
      padding: 0.85rem 1.15rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: var(--shadow-sm);
      white-space: pre-wrap;
    }

    .message-row.user .message-bubble {
      background-color: var(--user-msg-bg);
      color: var(--user-msg-text);
      border-bottom-right-radius: 2px;
    }

    .message-row.bot .message-bubble {
      background-color: var(--bot-msg-bg);
      color: var(--bot-msg-text);
      border: 1px solid var(--bot-border);
      border-bottom-left-radius: 2px;
    }

    /* Indicador de Digitação */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      background-color: var(--bot-msg-bg);
      border: 1px solid var(--bot-border);
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .dots {
      display: flex;
      gap: 0.25rem;
    }

    .dot {
      width: 6px;
      height: 6px;
      background-color: var(--text-secondary);
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    /* Rodapé do Chat */
    .chat-footer {
      padding: 1rem 1.5rem;
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
    }

    .input-container {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 0.85rem 1.15rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent-color);
    }

    .btn-send {
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: var(--radius-sm);
      background-color: var(--accent-color);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background-color 0.2s;
    }

    .btn-send:hover {
      background-color: var(--accent-hover);
    }

    .btn-send:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Animações */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messageSlide {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
      40% { transform: scale(1.2); opacity: 1; }
    }

    /* Adaptabilidade Mobile */
    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .chat-wrapper {
        height: 100vh;
        max-width: 100%;
        border-radius: 0;
        border: none;
      }

      .login-container {
        margin: 1rem;
      }

      .message-row {
        max-width: 90%;
      }

      .header-actions span {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Tela de Login -->
  <div class="login-container" id="loginScreen">
    <div class="login-header">
      <i class="fa-solid fa-robot"></i>
      <h2>Portal Gemini Chat</h2>
      <p>Acesse com suas credenciais de aluno</p>
    </div>

    <div class="error-alert" id="loginError">
      <i class="fa-solid fa-triangle-exclamation"></i>
      <span>Usuário ou senha incorretos!</span>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required value="aluno">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required value="12345">
        </div>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>

  <!-- 2. Tela Principal do Chat -->
  <div class="chat-wrapper" id="chatScreen">
    <!-- Cabeçalho -->
    <header class="chat-header">
      <div class="user-info">
        <div class="user-avatar" id="avatarLetter">A</div>
        <div class="user-details">
          <h3 id="displayUsername">👤 Logado como: aluno</h3>
          <span>Sessão Ativa</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="btn-action" onclick="toggleTheme()" title="Alternar Modo Escuro/Claro">
          <i class="fa-solid fa-moon" id="themeIcon"></i>
          <span>Alternar Tema</span>
        </button>
        <button class="btn-action btn-danger" onclick="clearChat()" title="Limpar Histórico de Mensagens">
          <i class="fa-solid fa-trash-can"></i>
          <span>Limpar</span>
        </button>
      </div>
    </header>

    <!-- Área de Exibição das Mensagens -->
    <main class="chat-messages" id="chatMessages">
      <!-- Mensagem Inicial do Bot -->
      <div class="message-row bot">
        <div class="message-sender">
          <i class="fa-solid fa-robot" style="color: #10b981;"></i> 🤖 Gemini IA
        </div>
        <div class="message-bubble">
          Olá, Aluno! Sou o seu assistente inteligente powered by Gemini. Como posso ajudar nos seus estudos hoje?
        </div>
      </div>
    </main>

    <!-- Indicador de Digitação -->
    <div class="typing-indicator" id="typingIndicator">
      <i class="fa-solid fa-robot" style="color: #10b981;"></i>
      <span>🤖 Gemini IA está digitando</span>
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Rodapé de Envio -->
    <footer class="chat-footer">
      <form class="input-container" onsubmit="handleSendMessage(event)">
        <input type="text" id="userInput" class="chat-input" placeholder="Digite sua mensagem..." autocomplete="off">
        <button type="submit" class="btn-send" id="btnSend">
          <span>Enviar</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </footer>
  </div>

  <!-- JavaScript -->
  <script>
    // Configurações e Estado Global
    const GEMINI_API_KEY = "AQ.Ab8RN6JZSOVlNM5WMKLnTIxs9qwrZO_4T00biTLMDJHnKkcXig"; // Chave é injetada automaticamente em tempo de execução
    let currentUser = "";
    let isDarkMode = false;

    // Elementos DOM
    const loginScreen = document.getElementById('loginScreen');
    const chatScreen = document.getElementById('chatScreen');
    const loginError = document.getElementById('loginError');
    const displayUsername = document.getElementById('displayUsername');
    const avatarLetter = document.getElementById('avatarLetter');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const btnSend = document.getElementById('btnSend');
    const themeIcon = document.getElementById('themeIcon');

    // 1. Validação de Login
    function handleLogin(event) {
      event.preventDefault();
      
      const userVal = document.getElementById('username').value.trim();
      const passVal = document.getElementById('password').value.trim();

      // Autenticação com credenciais predefinidas
      if (userVal === "aluno" && passVal === "12345") {
        currentUser = userVal;
        loginError.style.display = 'none';
        
        // Atualizar Informações do Usuário
        displayUsername.textContent = `👤 Logado como: ${currentUser}`;
        avatarLetter.textContent = currentUser.charAt(0).toUpperCase();

        // Transição de telas
        loginScreen.style.display = 'none';
        chatScreen.style.display = 'flex';
        userInput.focus();
      } else {
        loginError.style.display = 'flex';
      }
    }

    // 2. Alternar Tema (Modo Claro / Escuro)
    function toggleTheme() {
      isDarkMode = !isDarkMode;
      document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
      
      if (isDarkMode) {
        themeIcon.classList.remove('fa-moon');
        themeIcon.classList.add('fa-sun');
      } else {
        themeIcon.classList.remove('fa-sun');
        themeIcon.classList.add('fa-moon');
      }
    }

    // 3. Limpar Conversa
    function clearChat() {
      chatMessages.innerHTML = `
        <div class="message-row bot">
          <div class="message-sender">
            <i class="fa-solid fa-robot" style="color: #10b981;"></i> 🤖 Gemini IA
          </div>
          <div class="message-bubble">
            Conversa redefinida. Como posso ajudar você agora?
          </div>
        </div>
      `;
    }

    // 4. Adicionar Mensagem na Interface
    function appendMessage(sender, text, isUser = false) {
      const messageRow = document.createElement('div');
      messageRow.className = `message-row ${isUser ? 'user' : 'bot'}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'message-sender';
      
      if (isUser) {
        senderDiv.innerHTML = `👤 ${sender}`;
      } else {
        senderDiv.innerHTML = `<i class="fa-solid fa-robot" style="color: #10b981;"></i> 🤖 ${sender}`;
      }

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'message-bubble';
      bubbleDiv.textContent = text;

      messageRow.appendChild(senderDiv);
      messageRow.appendChild(bubbleDiv);

      chatMessages.appendChild(messageRow);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 5. Enviar Mensagem para a API do Gemini
    async function handleSendMessage(event) {
      event.preventDefault();

      const text = userInput.value.trim();
      if (!text) return;

      // Renderiza a mensagem do usuário
      appendMessage(`Aluno`, text, true);
      userInput.value = '';
      
      // Bloqueia interface temporariamente
      userInput.disabled = true;
      btnSend.disabled = true;
      typingIndicator.style.display = 'flex';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const responseText = await fetchGeminiResponse(text);
        appendMessage('Gemini IA', responseText, false);
      } catch (error) {
        appendMessage('Gemini IA', `Erro ao comunicar com o servidor: ${error.message}`, false);
      } finally {
        // Desbloqueia interface
        userInput.disabled = false;
        btnSend.disabled = false;
        typingIndicator.style.display = 'none';
        userInput.focus();
      }
    }

    // 6. Chamada Fetch à API do Gemini (gemini-3-flash-preview)
    async function fetchGeminiResponse(promptText) {
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${GEMINI_API_KEY}`;

      const payload = {
        contents: [
          {
            parts: [
              { text: promptText }
            ]
          }
        ]
      };

      const response = await fetch(apiUrl, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error(`Status ${response.status}`);
      }

      const data = await response.json();
      
      // Extração da resposta textual
      const botText = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (botText) {
        return botText;
      } else {
        return "Não foi possível gerar uma resposta válida da IA.";
      }
    }
  </script>
